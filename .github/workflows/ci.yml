name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Run the test suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  formal:
    name: Lean verdict model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache toolchain and lake state
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            formal/.lake
          key: elan-${{ runner.os }}-${{ hashFiles('formal/lean-toolchain', 'formal/lake-manifest.json') }}
      - name: Verify the formal model
        run: python3 scripts/check_formal.py
      - name: Upload the verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formal-verification
          path: .artifacts/formal-verification.json
          if-no-files-found: warn
